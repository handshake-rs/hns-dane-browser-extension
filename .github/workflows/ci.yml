name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository and supply-chain policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal

      - name: Install pinned cargo-deny
        run: cargo +1.92.0 install cargo-deny --version 0.19.9 --locked

      - name: Verify repository policy
        run: |
          set -euo pipefail

          while IFS= read -r -d '' tracked_file; do
            base_name="${tracked_file##*/}"
            case "$base_name" in
              .env|.env.*|.envrc|local.properties|keystore.properties|signing.properties|release.properties|google-services.json|*.keystore|*.jks|*.p12|*.pfx|*.pkcs12|*.kdbx|*.pem|*.key|*.asc|service-account*.json|credentials*.json|firebase-adminsdk*.json)
                echo "::error::Potential secret-bearing file must not be tracked: $tracked_file"
                exit 1
                ;;
            esac
          done < <(git ls-files -z)

          if git grep -IEn \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16})' \
            -- . ':!scripts/verify-supply-chain.sh'; then
            echo "::error::Potential high-confidence secret found in a tracked file."
            exit 1
          fi

          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          shopt -u nullglob
          if [[ ${#workflow_files[@]} -eq 0 ]]; then
            echo "::error::No GitHub Actions workflows were found."
            exit 1
          fi

          while IFS= read -r action_reference; do
            action_reference="${action_reference#\"}"
            action_reference="${action_reference%\"}"
            action_reference="${action_reference#\'}"
            action_reference="${action_reference%\'}"
            if [[ "$action_reference" == ./* ]]; then
              continue
            fi
            if [[ ! "$action_reference" =~ ^[-A-Za-z0-9_.]+/[-A-Za-z0-9_.]+(/[-A-Za-z0-9_.]+)*@[0-9a-fA-F]{40}$ ]]; then
              echo "::error::GitHub Action is not pinned to a full commit SHA: $action_reference"
              exit 1
            fi
          done < <(sed -nE 's/^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*([^[:space:]#]+).*/\2/p' "${workflow_files[@]}")

      - name: Verify the locked Rust supply chain
        run: |
          set -euo pipefail
          if [[ ! -s rust/Cargo.lock ]]; then
            echo "::error::Required dependency lock is missing: rust/Cargo.lock"
            exit 1
          fi
          python3 -m unittest -v \
            tests/test_cargo_git_policy.py \
            tests/test_browser_qualification_provenance.py
          python3 scripts/verify_cargo_git_policy.py
          python3 scripts/generate-third-party-notices.py --check
          cargo +1.92.0 metadata \
            --locked \
            --manifest-path rust/Cargo.toml \
            --no-deps \
            --format-version 1 >/dev/null
          cargo +1.92.0 deny \
            --locked \
            --manifest-path rust/Cargo.toml \
            check \
            --config rust/deny.toml

      - name: Verify Chromium-only release boundaries
        run: |
          bash scripts/verify-supply-chain.sh
          bash scripts/check-version-consistency.sh
          bash scripts/check-runtime-boundaries.sh

  rust:
    name: Rust workspace and native host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy

      - name: Check Rust formatting
        run: cargo +1.92.0 fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Lint the Rust workspace
        run: cargo +1.92.0 clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test the Rust workspace
        run: >-
          cargo +1.92.0 test --locked
          --manifest-path rust/Cargo.toml
          --workspace
          --
          --test-threads=2

      - name: Build the Chromium native host
        run: cargo +1.92.0 build --locked --release --manifest-path rust/Cargo.toml -p hns-chromium-native-host

      - name: Build Setup with the exact native host embedded
        env:
          HNS_HEADER_SNAPSHOT_PATH: ${{ github.workspace }}/release/hns_headers_300000.snapshot.gzip
          HNS_NATIVE_HOST_PATH: ${{ github.workspace }}/rust/target/release/hns-chromium-native-host
        run: >-
          cargo +1.92.0 build --locked --release
          --manifest-path rust/Cargo.toml
          -p hns-browser-setup
          --features embedded-host

  extension:
    name: Chromium extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Lint the Chromium extension
        run: npm run lint:extension

      - name: Test the Chromium extension and native host
        run: npm run test:extension

      - name: Build the Chromium extension
        run: npm run build:extension

      - name: Test deterministic release packaging
        run: |
          python3 -m unittest -v \
            tests/test_release_packaging.py \
            tests/test_release_workflow.py \
            tests/test_resign_windows_workflow.py

  qualification:
    name: Installed-browser qualification artifact
    needs: policy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install the static Linux build target
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            file \
            musl-tools
          if ! command -v aarch64-linux-musl-gcc >/dev/null 2>&1; then
            sudo ln -s "$(command -v musl-gcc)" /usr/local/bin/aarch64-linux-musl-gcc
          fi
          rustup toolchain install 1.92.0 --profile minimal
          rustup target add --toolchain 1.92.0 aarch64-unknown-linux-musl

      - name: Build the exact native host and canonical extension
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
        run: |
          set -euo pipefail
          bash scripts/check-runtime-boundaries.sh
          npm run lint:extension
          npm run build:extension
          cargo +1.92.0 build \
            --locked \
            --release \
            --manifest-path rust/Cargo.toml \
            -p hns-chromium-native-host \
            --target aarch64-unknown-linux-musl

      - name: Verify and package qualification inputs
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          native_host="rust/target/aarch64-unknown-linux-musl/release/hns-chromium-native-host"
          if readelf --program-headers "$native_host" | grep -q 'INTERP'; then
            echo "::error::The qualification native host is not statically linked."
            exit 1
          fi
          if readelf --dynamic "$native_host" | grep -q '(NEEDED)'; then
            echo "::error::The qualification native host has a dynamic dependency."
            exit 1
          fi
          canonical_id="$(jq -er '.canonicalId' release/extension-identity.json)"
          version="$(jq -er '.version' extension/manifest.json)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          "$native_host" \
            --print-host-manifest \
            --extension-id "$canonical_id" >/dev/null
          mkdir -p dist/qualification
          python3 scripts/package-release.py extension \
            --output-dir dist/qualification \
            --source-date-epoch "$source_date_epoch" \
            --source-commit "$SOURCE_COMMIT" \
            --candidate-source \
            --extension-id "$canonical_id"
          python3 scripts/package-release.py native \
            --output-dir dist/qualification \
            --source-date-epoch "$source_date_epoch" \
            --source-commit "$SOURCE_COMMIT" \
            --candidate-source \
            --extension-id "$canonical_id" \
            --platform linux \
            --architecture arm64 \
            --rust-target aarch64-unknown-linux-musl \
            --native-host "$native_host"
          canonical_extension="dist/qualification/hns-dane-browser-extension-v${version}-mv3.zip"
          native_archive="dist/qualification/hns-dane-browser-native-host-v${version}-linux-arm64.tar.gz"
          cp "$native_host" dist/qualification/hns-chromium-native-host
          find dist/qualification -maxdepth 1 -type f \
            ! -name "${canonical_extension##*/}" \
            ! -name "${canonical_extension##*/}.sha256" \
            ! -name "${native_archive##*/}" \
            ! -name "${native_archive##*/}.sha256" \
            ! -name hns-chromium-native-host \
            -delete
          python3 scripts/create_browser_qualification_provenance.py \
            --source-commit "$SOURCE_COMMIT" \
            --platform linux \
            --architecture arm64 \
            --rust-target aarch64-unknown-linux-musl \
            --runner-image ubuntu-24.04-arm \
            --file "nativeHostExecutable=dist/qualification/hns-chromium-native-host" \
            --file "nativeHostArchive=$native_archive" \
            --file "nativeHostArchiveChecksum=${native_archive}.sha256" \
            --file "canonicalExtension=$canonical_extension" \
            --file "canonicalExtensionChecksum=${canonical_extension}.sha256" \
            --output dist/qualification/QUALIFICATION-PROVENANCE.json
          for expected in \
            hns-chromium-native-host \
            "${native_archive##*/}" \
            "${native_archive##*/}.sha256" \
            "${canonical_extension##*/}" \
            "${canonical_extension##*/}.sha256" \
            QUALIFICATION-PROVENANCE.json; do
            test -f "dist/qualification/$expected"
            test ! -L "dist/qualification/$expected"
          done
          qualification_file_count="$(
            find dist/qualification -mindepth 1 -maxdepth 1 -type f | wc -l
          )"
          test "$qualification_file_count" -eq 6
          if find dist/qualification -mindepth 1 ! -type f -print -quit \
            | grep -q .; then
            echo "::error::Qualification artifact contains a nested or special entry."
            exit 1
          fi

      - name: Retain exact-SHA installed-browser inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-browser-qualification-${{ github.sha }}-linux-arm64
          path: dist/qualification/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  required:
    name: Required CI
    needs: [policy, rust, extension, qualification]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every required gate passed
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        run: |
          set -euo pipefail
          failed=0

          check_gate() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name gate finished with $result."
              failed=1
            fi
          }

          check_gate "Repository and supply-chain policy" "$POLICY_RESULT"
          check_gate "Rust workspace and native host" "$RUST_RESULT"
          check_gate "Chromium extension" "$EXTENSION_RESULT"
          check_gate "Installed-browser qualification artifact" "$QUALIFICATION_RESULT"
          exit "$failed"
