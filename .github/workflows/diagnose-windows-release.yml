name: Diagnose Windows release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.repository == 'handshake-rs/hns-dane-browser-extension' && github.ref == 'refs/heads/main' }}
    runs-on: windows-2025
    timeout-minutes: 30
    environment: windows-signing
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build verifier probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/import-msvc-environment.ps1 -Architecture x64
          Write-Host 'Diagnostic: MSVC environment ready.'
          $source = Join-Path $env:RUNNER_TEMP 'hns-verifier-probe.c'
          $binary = Join-Path $env:RUNNER_TEMP 'hns-verifier-probe.exe'
          Set-Content -LiteralPath $source -Value 'int main(void) { return 0; }'
          & cl.exe /nologo /MT "/Fe:$binary" $source
          if ($LASTEXITCODE -ne 0) {
            throw 'The verifier probe did not compile.'
          }
          Write-Host 'Diagnostic: verifier probe built.'

      - name: Sign verifier probe
        shell: pwsh
        env:
          WINDOWS_AUTHENTICODE_PUBLISHER: ${{ vars.WINDOWS_AUTHENTICODE_PUBLISHER }}
          WINDOWS_SELF_SIGNED_CERTIFICATE_SHA256: ${{ vars.WINDOWS_SELF_SIGNED_CERTIFICATE_SHA256 }}
          WINDOWS_SELF_SIGNED_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_BASE64 }}
          WINDOWS_SELF_SIGNED_PFX_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = (
            Resolve-Path (Join-Path $env:RUNNER_TEMP 'hns-verifier-probe.exe')
          ).Path
          & ./scripts/sign-self-signed-windows.ps1 `
            -Path @($probe) `
            -PinnedCertificate 'release/windows-self-signed-code-signing.cer'
          Write-Host 'Diagnostic: verifier probe signed.'

      - name: Verify signed probe
        shell: pwsh
        env:
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.WINDOWS_SELF_SIGNED_CERTIFICATE_SHA256 }}
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_AUTHENTICODE_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Diagnostic: trying certutil noninteractive trust import.'
          $certificate = (
            Resolve-Path 'release/windows-self-signed-code-signing.cer'
          ).Path
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certificate)
          try {
            & certutil.exe -user -f -addstore Root $certificate
            if ($LASTEXITCODE -ne 0) {
              throw 'certutil trust import failed.'
            }
            Write-Host 'Diagnostic: certutil trust import completed.'
          } finally {
            & certutil.exe -user -delstore Root $cert.Thumbprint
            Write-Host "Diagnostic: certutil trust removal exit code $LASTEXITCODE."
            $cert.Dispose()
          }
          & ./scripts/import-msvc-environment.ps1 -Architecture x64
          Write-Host 'Diagnostic: verifier starting.'
          $probe = (
            Resolve-Path (Join-Path $env:RUNNER_TEMP 'hns-verifier-probe.exe')
          ).Path
          & ./scripts/verify-windows-binaries.ps1 `
            -Path @($probe) `
            -RequireAuthenticode `
            -AllowSelfSigned `
            -ExpectedPublisher $env:EXPECTED_PUBLISHER `
            -ExpectedCertificateSha256 $env:EXPECTED_CERTIFICATE_SHA256 `
            -SelfSignedCertificate 'release/windows-self-signed-code-signing.cer'
          Write-Host 'Diagnostic: signed probe verified.'
