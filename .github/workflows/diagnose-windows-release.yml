name: Diagnose Windows release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.repository == 'handshake-rs/hns-dane-browser-extension' && github.ref == 'refs/heads/main' }}
    runs-on: windows-2025
    timeout-minutes: 30
    environment: windows-signing
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build verifier probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/import-msvc-environment.ps1 -Architecture x64
          Write-Host 'Diagnostic: MSVC environment ready.'
          $source = Join-Path $env:RUNNER_TEMP 'hns-verifier-probe.c'
          $binary = Join-Path $env:RUNNER_TEMP 'hns-verifier-probe.exe'
          Set-Content -LiteralPath $source -Value 'int main(void) { return 0; }'
          & cl.exe /nologo /MT "/Fe:$binary" $source
          if ($LASTEXITCODE -ne 0) {
            throw 'The verifier probe did not compile.'
          }
          Write-Host 'Diagnostic: verifier probe built.'

      - name: Sign verifier probe
        shell: pwsh
        env:
          WINDOWS_AUTHENTICODE_PUBLISHER: ${{ vars.WINDOWS_AUTHENTICODE_PUBLISHER }}
          WINDOWS_SELF_SIGNED_CERTIFICATE_SHA256: ${{ vars.WINDOWS_SELF_SIGNED_CERTIFICATE_SHA256 }}
          WINDOWS_SELF_SIGNED_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_BASE64 }}
          WINDOWS_SELF_SIGNED_PFX_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = (
            Resolve-Path (Join-Path $env:RUNNER_TEMP 'hns-verifier-probe.exe')
          ).Path
          & ./scripts/sign-self-signed-windows.ps1 `
            -Path @($probe) `
            -PinnedCertificate 'release/windows-self-signed-code-signing.cer'
          Write-Host 'Diagnostic: verifier probe signed.'

      - name: Verify signed probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/import-msvc-environment.ps1 -Architecture x64
          $probe = (
            Resolve-Path (Join-Path $env:RUNNER_TEMP 'hns-verifier-probe.exe')
          ).Path
          $tampered = Join-Path $env:RUNNER_TEMP 'hns-verifier-tampered.exe'
          Copy-Item -LiteralPath $probe -Destination $tampered
          $bytes = [System.IO.File]::ReadAllBytes($tampered)
          $bytes[512] = $bytes[512] -bxor 1
          [System.IO.File]::WriteAllBytes($tampered, $bytes)
          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse -File | Where-Object {
              $_.FullName -match '\\x64\\'
            } | Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($candidate in @($probe, $tampered)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $candidate
            Write-Host "Diagnostic: $([IO.Path]::GetFileName($candidate)) status=$($signature.Status) message=$($signature.StatusMessage)"
            & $signTool.FullName verify /pa /all /v /tw $candidate | Out-Host
            Write-Host "Diagnostic: $([IO.Path]::GetFileName($candidate)) SignTool exit=$LASTEXITCODE"
          }
