name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag and inspect release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      canonical-extension-id: ${{ steps.validate.outputs.canonical-extension-id }}
      extension-id: ${{ steps.validate.outputs.extension-id }}
      extension-ids: ${{ steps.validate.outputs.extension-ids }}
      release-state: ${{ steps.release.outputs.state }}
      version: ${{ steps.validate.outputs.version }}
      source-date-epoch: ${{ steps.validate.outputs.source-date-epoch }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release identity and version
        id: validate
        env:
          CONFIGURED_CATALOG_ID: ${{ vars.CHROMIUM_EXTENSION_ID }}
          CHROME_CATALOG_ID: ${{ vars.CHROME_EXTENSION_ID }}
          EDGE_CATALOG_ID: ${{ vars.EDGE_EXTENSION_ID }}
          OPERA_CATALOG_ID: ${{ vars.OPERA_EXTENSION_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          canonical_extension_id="$(
            jq -er '.canonicalId' release/extension-identity.json
          )"
          if [[ ! "$canonical_extension_id" =~ ^[a-p]{32}$ ]]; then
            echo "::error::The canonical extension ID is invalid."
            exit 1
          fi
          catalog_ids=()
          for extension_id in \
            "$CONFIGURED_CATALOG_ID" \
            "$CHROME_CATALOG_ID" \
            "$EDGE_CATALOG_ID" \
            "$OPERA_CATALOG_ID"; do
            if [[ -z "$extension_id" ]]; then
              continue
            fi
            if [[ ! "$extension_id" =~ ^[a-p]{32}$ ]]; then
              echo "::error::Every configured catalog extension ID must contain exactly 32 characters from a through p."
              exit 1
            fi
            if [[ " ${catalog_ids[*]-} " != *" $extension_id "* ]]; then
              catalog_ids+=("$extension_id")
            fi
          done
          extension_id="${catalog_ids[0]:-$canonical_extension_id}"
          extension_ids=("$canonical_extension_id")
          for candidate in "${catalog_ids[@]}"; do
            if [[ "$candidate" != "$canonical_extension_id" ]]; then
              extension_ids+=("$candidate")
            fi
          done
          extension_ids_csv="$(IFS=,; echo "${extension_ids[*]}")"
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub supplied an invalid source commit."
            exit 1
          fi

          bash scripts/check-version-consistency.sh
          version="$(jq -er '.version' extension/manifest.json)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match extension manifest version $version."
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$tag_commit" != "$SOURCE_COMMIT" ]]; then
            echo "::error::Checked-out source $SOURCE_COMMIT does not match tag commit $tag_commit."
            exit 1
          fi
          default_branch_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          if [[ -z "$DEFAULT_BRANCH" ]] ||
            ! git show-ref --verify --quiet "$default_branch_ref"; then
            echo "::error::Unable to resolve the repository default branch."
            exit 1
          fi
          default_branch_commit="$(git rev-parse "${default_branch_ref}^{commit}")"
          if [[ "$SOURCE_COMMIT" != "$default_branch_commit" ]]; then
            echo "::error::Release tag must point to the exact current $DEFAULT_BRANCH tip ($default_branch_commit)."
            exit 1
          fi
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_COMMIT")"
          if [[ ! "$source_date_epoch" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to derive a deterministic source timestamp."
            exit 1
          fi
          {
            echo "canonical-extension-id=$canonical_extension_id"
            echo "extension-id=$extension_id"
            echo "extension-ids=$extension_ids_csv"
            echo "version=$version"
            echo "source-date-epoch=$source_date_epoch"
          } >>"$GITHUB_OUTPUT"

      - name: Inspect any existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_pages="$(
            gh api --paginate \
              "repos/${REPOSITORY}/releases?per_page=100"
          )"
          release_matches="$(
            jq -cs \
              --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)]' \
              <<<"$release_pages"
          )"
          release_count="$(jq -r 'length' <<<"$release_matches")"
          if [[ "$release_count" == 1 ]]; then
            release_body="$(jq -r '.[0].body // ""' <<<"$release_matches")"
            if ! grep -Fq \
              "https://github.com/${REPOSITORY}/commit/${SOURCE_COMMIT}" \
              <<<"$release_body"; then
              echo "::error::Existing release source does not match the current tag commit."
              exit 1
            fi
            is_draft="$(jq -r '.[0].draft' <<<"$release_matches")"
            if [[ "$is_draft" == true ]]; then
              state="draft"
            else
              state="published"
            fi
          elif [[ "$release_count" == 0 ]]; then
            state="absent"
          else
            echo "::error::Multiple releases unexpectedly use tag $RELEASE_TAG."
            exit 1
          fi
          echo "state=$state" >>"$GITHUB_OUTPUT"

  quality:
    name: Portable release gates
    needs: prepare
    if: ${{ needs.prepare.outputs.release-state != 'published' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install pinned release tools
        run: |
          set -euo pipefail
          rustup toolchain install 1.92.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          cargo +1.92.0 install cargo-deny --version 0.19.9 --locked

      - name: Run the complete portable release gate
        run: bash scripts/check.sh

  extension:
    name: Bundle finalized setup applications into the MV3 extension
    needs: [prepare, native, signed_macos, signed_windows]
    if: ${{ needs.prepare.outputs.release-state != 'published' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Retrieve all finalized platform archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-platform-*
          path: dist/platform-assets
          merge-multiple: true

      - name: Build the browser-neutral extension
        run: |
          set -euo pipefail
          npm run lint:extension
          npm run build:extension

      - name: Verify Linux keyless build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for architecture in x64 arm64; do
            gh attestation verify \
              "dist/platform-assets/hns-dane-browser-setup-v${VERSION}-linux-${architecture}.tar.gz" \
              --repo "$GITHUB_REPOSITORY"
          done

      - name: Package the MV3 extension
        env:
          EXTENSION_ID: ${{ needs.prepare.outputs.extension-id }}
          EXTENSION_IDS: ${{ needs.prepare.outputs.extension-ids }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source-date-epoch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/package-release.py extension \
            --output-dir dist/release \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$RELEASE_TAG" \
            --extension-id "$EXTENSION_ID" \
            --extension-ids "$EXTENSION_IDS" \
            --setup-dir dist/platform-assets \
            --linux-attestations-verified
          asset="dist/release/hns-dane-browser-extension-v${VERSION}-mv3.zip"
          store_asset="dist/release/hns-dane-browser-extension-v${VERSION}-mv3-store.zip"
          test -s "$asset"
          test -s "${asset}.sha256"
          test -s "$store_asset"
          test -s "${store_asset}.sha256"

      - name: Retain the extension release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-extension
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  native:
    name: Native host and setup (${{ matrix.platform }}-${{ matrix.architecture }})
    needs: prepare
    if: ${{ needs.prepare.outputs.release-state != 'published' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x64
            runner: ubuntu-24.04
            native-rust-target: x86_64-unknown-linux-musl
            setup-rust-target: x86_64-unknown-linux-gnu
            musl-cc: x86_64-linux-musl-gcc
            binary-suffix: ""
            python: python3
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            native-rust-target: aarch64-unknown-linux-musl
            setup-rust-target: aarch64-unknown-linux-gnu
            musl-cc: aarch64-linux-musl-gcc
            binary-suffix: ""
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Linux build and runtime dependencies
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        env:
          MUSL_CC: ${{ matrix.musl-cc }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libdecor-0-0 \
            libegl1 \
            libgl1 \
            libglvnd0 \
            libglx0 \
            libnss3-tools \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcursor1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxrandr2 \
            musl-tools \
            openssl
          if ! command -v "$MUSL_CC" >/dev/null 2>&1; then
            sudo ln -s "$(command -v musl-gcc)" "/usr/local/bin/$MUSL_CC"
          fi

      - name: Install the pinned Rust targets
        shell: pwsh
        env:
          NATIVE_RUST_TARGET: ${{ matrix.native-rust-target }}
          SETUP_RUST_TARGET: ${{ matrix.setup-rust-target }}
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.92.0 --profile minimal
          $targets = @(
            $env:NATIVE_RUST_TARGET,
            $env:SETUP_RUST_TARGET
          ) | Select-Object -Unique
          foreach ($target in $targets) {
            rustup target add --toolchain 1.92.0 $target
          }

      - name: Build the native host and embedded-host setup
        shell: pwsh
        env:
          BINARY_SUFFIX: ${{ matrix.binary-suffix }}
          HNS_EXTENSION_IDS: ${{ needs.prepare.outputs.extension-ids }}
          HNS_HEADER_SNAPSHOT_PATH: ${{ github.workspace }}/release/hns_headers_300000.snapshot.gzip
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}
          MUSL_CC: ${{ matrix.musl-cc }}
          NATIVE_RUST_TARGET: ${{ matrix.native-rust-target }}
          PLATFORM: ${{ matrix.platform }}
          SETUP_RUST_TARGET: ${{ matrix.setup-rust-target }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PLATFORM -eq 'linux') {
            $targetEnvironment = $env:NATIVE_RUST_TARGET.ToUpperInvariant().Replace('-', '_')
            Set-Item -Path "Env:CARGO_TARGET_${targetEnvironment}_LINKER" -Value $env:MUSL_CC
            $ccEnvironment = $env:NATIVE_RUST_TARGET.Replace('-', '_')
            Set-Item -Path "Env:CC_${ccEnvironment}" -Value $env:MUSL_CC
          }
          if ($env:PLATFORM -eq 'windows') {
            $env:RUSTFLAGS = (
              "$env:RUSTFLAGS -C target-feature=+crt-static"
            ).Trim()
          }
          cargo +1.92.0 build --locked --release `
            --manifest-path rust/Cargo.toml `
            -p hns-chromium-native-host `
            --target $env:NATIVE_RUST_TARGET
          $nativeHost = "rust/target/$env:NATIVE_RUST_TARGET/release/hns-chromium-native-host$env:BINARY_SUFFIX"
          $env:HNS_NATIVE_HOST_PATH = (
            Resolve-Path -LiteralPath $nativeHost
          ).Path
          cargo +1.92.0 build --locked --release `
            --manifest-path rust/Cargo.toml `
            -p hns-browser-setup `
            --bin hns-dane-browser-setup `
            --features embedded-host `
            --target $env:SETUP_RUST_TARGET

      - name: Verify the static Linux native host and GNU setup
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        env:
          CANONICAL_EXTENSION_ID: ${{ needs.prepare.outputs.canonical-extension-id }}
          NATIVE_RUST_TARGET: ${{ matrix.native-rust-target }}
          SETUP_RUST_TARGET: ${{ matrix.setup-rust-target }}
        run: |
          set -euo pipefail
          native_host="rust/target/$NATIVE_RUST_TARGET/release/hns-chromium-native-host"
          setup="rust/target/$SETUP_RUST_TARGET/release/hns-dane-browser-setup"
          file "$native_host" "$setup"
          if readelf --program-headers "$native_host" | grep -q 'INTERP'; then
            echo "::error::The Linux native host contains a dynamic program interpreter."
            exit 1
          fi
          if readelf --dynamic "$native_host" | grep -q '(NEEDED)'; then
            echo "::error::The Linux native host is dynamically linked."
            exit 1
          fi
          if ldd "$setup" | grep -q 'not found'; then
            echo "::error::The Linux setup has an unresolved build-runner dependency."
            exit 1
          fi
          "$native_host" \
            --print-host-manifest \
            --extension-id "$CANONICAL_EXTENSION_ID" >/dev/null

      - name: Verify Windows static CRT and setup status
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          BINARY_SUFFIX: ${{ matrix.binary-suffix }}
          NATIVE_RUST_TARGET: ${{ matrix.native-rust-target }}
          SETUP_RUST_TARGET: ${{ matrix.setup-rust-target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeHost = "rust/target/$env:NATIVE_RUST_TARGET/release/hns-chromium-native-host$env:BINARY_SUFFIX"
          $setup = "rust/target/$env:SETUP_RUST_TARGET/release/hns-dane-browser-setup$env:BINARY_SUFFIX"
          $binaries = @($nativeHost, $setup)
          & ./scripts/verify-windows-binaries.ps1 -Path $binaries
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows import allowlist verification failed.'
          }
          & $setup --status | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw 'The Windows setup status smoke check failed.'
          }
          $process = Start-Process `
            -FilePath $setup `
            -ArgumentList '--gui-smoke-test' `
            -PassThru
          try {
            if (-not $process.WaitForExit(30000)) {
              throw 'The Windows setup GUI smoke check timed out.'
            }
            if ($process.ExitCode -ne 0) {
              throw "The Windows setup GUI smoke check failed with exit code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Verify macOS system-only dependencies and setup status
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}
          NATIVE_RUST_TARGET: ${{ matrix.native-rust-target }}
          SETUP_RUST_TARGET: ${{ matrix.setup-rust-target }}
        run: |
          set -euo pipefail
          native_host="rust/target/$NATIVE_RUST_TARGET/release/hns-chromium-native-host"
          setup="rust/target/$SETUP_RUST_TARGET/release/hns-dane-browser-setup"
          bash scripts/verify-macos-binaries.sh "$native_host" "$setup"
          "$setup" --status >/dev/null
          "$setup" --gui-smoke-test &
          smoke_pid=$!
          smoke_status=
          for _attempt in {1..30}; do
            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              if wait "$smoke_pid"; then
                smoke_status=0
              else
                smoke_status=$?
              fi
              break
            fi
            sleep 1
          done
          if [[ -z "$smoke_status" ]]; then
            kill "$smoke_pid" 2>/dev/null || true
            wait "$smoke_pid" 2>/dev/null || true
            echo "::error::The macOS setup GUI smoke check timed out."
            exit 1
          fi
          if [[ "$smoke_status" != 0 ]]; then
            echo "::error::The macOS setup GUI smoke check failed with status $smoke_status."
            exit 1
          fi

      - name: Stage the bundled Linux setup runtime
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          SETUP_RUST_TARGET: ${{ matrix.setup-rust-target }}
        run: |
          set -euo pipefail
          setup="rust/target/$SETUP_RUST_TARGET/release/hns-dane-browser-setup"
          python3 scripts/package-release.py linux-runtime \
            --output-dir dist/linux-setup-runtime \
            --architecture "$ARCHITECTURE" \
            --certutil "$(command -v certutil)" \
            --setup-executable "$setup"

      - name: Package the native host and setup application
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          BINARY_SUFFIX: ${{ matrix.binary-suffix }}
          EXTENSION_ID: ${{ needs.prepare.outputs.extension-id }}
          EXTENSION_IDS: ${{ needs.prepare.outputs.extension-ids }}
          NATIVE_RUST_TARGET: ${{ matrix.native-rust-target }}
          PLATFORM: ${{ matrix.platform }}
          PYTHON_COMMAND: ${{ matrix.python }}
          RELEASE_TAG: ${{ github.ref_name }}
          SETUP_RUST_TARGET: ${{ matrix.setup-rust-target }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source-date-epoch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeHost = "rust/target/$env:NATIVE_RUST_TARGET/release/hns-chromium-native-host$env:BINARY_SUFFIX"
          $setup = "rust/target/$env:SETUP_RUST_TARGET/release/hns-dane-browser-setup$env:BINARY_SUFFIX"
          & $env:PYTHON_COMMAND scripts/package-release.py native `
            --output-dir dist/release `
            --source-date-epoch $env:SOURCE_DATE_EPOCH `
            --source-commit $env:SOURCE_COMMIT `
            --source-tag $env:RELEASE_TAG `
            --extension-id $env:EXTENSION_ID `
            --extension-ids $env:EXTENSION_IDS `
            --platform $env:PLATFORM `
            --architecture $env:ARCHITECTURE `
            --rust-target $env:NATIVE_RUST_TARGET `
            --native-host $nativeHost
          if ($LASTEXITCODE -ne 0) {
            throw 'Native-host packaging failed.'
          }
          $setupArguments = @(
            'scripts/package-release.py',
            'setup',
            '--output-dir', 'dist/release',
            '--source-date-epoch', $env:SOURCE_DATE_EPOCH,
            '--source-commit', $env:SOURCE_COMMIT,
            '--source-tag', $env:RELEASE_TAG,
            '--extension-id', $env:EXTENSION_ID,
            '--extension-ids', $env:EXTENSION_IDS,
            '--platform', $env:PLATFORM,
            '--architecture', $env:ARCHITECTURE,
            '--native-rust-target', $env:NATIVE_RUST_TARGET,
            '--setup-rust-target', $env:SETUP_RUST_TARGET,
            '--setup-executable', $setup,
            '--embedded-native-host', $nativeHost
          )
          if ($env:PLATFORM -eq 'linux') {
            $setupArguments += @(
              '--linux-runtime', 'dist/linux-setup-runtime'
            )
          }
          & $env:PYTHON_COMMAND @setupArguments
          if ($LASTEXITCODE -ne 0) {
            throw 'Setup-application packaging failed.'
          }
          $extension = if ($env:PLATFORM -eq 'windows') { 'zip' } else { 'tar.gz' }
          $assets = @(
            "dist/release/hns-dane-browser-native-host-v$env:VERSION-$env:PLATFORM-$env:ARCHITECTURE.$extension",
            "dist/release/hns-dane-browser-setup-v$env:VERSION-$env:PLATFORM-$env:ARCHITECTURE.$extension"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf) -or
                -not (Test-Path -LiteralPath "$asset.sha256" -PathType Leaf)) {
              throw "Release artifacts are missing for $asset."
            }
          }

      - name: Smoke test the bundled Linux setup layout
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/release/hns-dane-browser-setup-v${VERSION}-linux-${ARCHITECTURE}.tar.gz"
          temporary="$(mktemp -d)"
          cleanup() {
            find "$temporary" -mindepth 1 -delete
            rmdir "$temporary"
          }
          trap cleanup EXIT
          tar -xzf "$archive" -C "$temporary"
          root="$temporary/hns-dane-browser-setup-v${VERSION}-linux-${ARCHITECTURE}"
          app="$root/HNS-DANE-Browser-Setup.AppDir"
          if [[ -d "$app/usr/lib" ]] &&
            [[ -n "$(find "$app/usr/lib" -type f -print -quit)" ]]; then
            echo "::error::The Linux Setup package must not bundle GUI shared libraries."
            exit 1
          fi
          if grep -q 'LD_LIBRARY_PATH' "$app/AppRun"; then
            echo "::error::The Linux Setup launcher must not override the host GUI library path."
            exit 1
          fi
          glibc_ceiling="2.39"
          elf_count=0
          while IFS= read -r -d '' candidate; do
            if ! file "$candidate" | grep -q 'ELF'; then
              continue
            fi
            elf_count=$((elf_count + 1))
            required_glibc="$(
              readelf --version-info "$candidate" 2>/dev/null |
                grep -oE 'GLIBC_[0-9]+\.[0-9]+' |
                sed 's/^GLIBC_//' |
                sort -Vu |
                tail -n 1 || true
            )"
            if [[ -n "$required_glibc" ]] &&
              [[ "$(printf '%s\n%s\n' "$required_glibc" "$glibc_ceiling" | sort -V | tail -n 1)" != "$glibc_ceiling" ]]; then
              echo "::error::$candidate requires glibc $required_glibc, above the documented $glibc_ceiling ceiling."
              exit 1
            fi
          done < <(find "$app" -type f -print0)
          if ((elf_count == 0)); then
            echo "::error::The Linux Setup package contained no ELF objects."
            exit 1
          fi
          mkdir "$temporary/home"
          mkdir "$temporary/nssdb"
          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -nodes \
            -subj "/CN=Shakescape release smoke test" \
            -days 1 \
            -keyout "$temporary/smoke.key" \
            -out "$temporary/smoke.pem" >/dev/null 2>&1
          clean_helper=(
            env
            -i
            "HOME=$temporary/home"
            "PATH=/usr/bin:/bin"
            "$app/usr/libexec/certutil"
          )
          "${clean_helper[@]}" \
            -N \
            -d "sql:$temporary/nssdb" \
            --empty-password
          "${clean_helper[@]}" \
            -A \
            -d "sql:$temporary/nssdb" \
            -n "release-smoke" \
            -t "C,," \
            -i "$temporary/smoke.pem"
          "${clean_helper[@]}" \
            -L \
            -d "sql:$temporary/nssdb" >/dev/null
          "${clean_helper[@]}" \
            -D \
            -d "sql:$temporary/nssdb" \
            -n "release-smoke"
          "$app/AppRun" --status >/dev/null

      - name: Attest the finalized Linux archives with GitHub OIDC
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*.tar.gz
          show-summary: false

      - name: Retain the platform release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  signed_macos:
    name: Sign, notarize, and staple macOS (${{ matrix.architecture }})
    needs: [prepare, quality]
    if: ${{ needs.prepare.outputs.release-state != 'published' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: macos-15-intel
            native-rust-target: x86_64-apple-darwin
            setup-rust-target: x86_64-apple-darwin
          - architecture: arm64
            runner: macos-15
            native-rust-target: aarch64-apple-darwin
            setup-rust-target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    environment: macos-signing
    permissions:
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build, sign, notarize, staple, and verify
        shell: bash
        env:
          APPLE_CERTIFICATE_NAME: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_NAME }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_CERTIFICATE_SHA256: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_SHA256 }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ vars.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_NOTARY_API_KEY_ID: ${{ vars.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_PRIVATE_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ARCHITECTURE: ${{ matrix.architecture }}
          EXTENSION_ID: ${{ needs.prepare.outputs.extension-id }}
          EXTENSION_IDS: ${{ needs.prepare.outputs.extension-ids }}
          HNS_EXTENSION_IDS: ${{ needs.prepare.outputs.extension-ids }}
          HNS_HEADER_SNAPSHOT_PATH: ${{ github.workspace }}/release/hns_headers_300000.snapshot.gzip
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          NATIVE_RUST_TARGET: ${{ matrix.native-rust-target }}
          OUTPUT_DIR: ${{ github.workspace }}/dist/signed
          RELEASE_TAG: ${{ github.ref_name }}
          SETUP_RUST_TARGET: ${{ matrix.setup-rust-target }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source-date-epoch }}
          SOURCE_ROOT: ${{ github.workspace }}
          TOOLS_ROOT: ${{ github.workspace }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/build-signed-macos-release.sh

      - name: Retain finalized macOS release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-macos-${{ matrix.architecture }}
          path: |
            dist/signed/*.tar.gz
            dist/signed/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain Apple notarization evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-notary-evidence-${{ matrix.architecture }}
          path: dist/signed/notary-reports/*.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  signed_windows:
    name: Self-sign and timestamp Windows (${{ matrix.architecture }})
    needs: [prepare, quality]
    if: ${{ needs.prepare.outputs.release-state != 'published' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            rust-target: x86_64-pc-windows-msvc
          - architecture: arm64
            rust-target: aarch64-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 120
    environment: windows-signing
    permissions:
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build the static-CRT native host
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/import-msvc-environment.ps1 -Architecture $env:ARCHITECTURE
          rustup toolchain install 1.92.0 --profile minimal
          rustup target add --toolchain 1.92.0 $env:RUST_TARGET
          $env:RUSTFLAGS = (
            "$env:RUSTFLAGS -C target-feature=+crt-static"
          ).Trim()
          cargo +1.92.0 build --locked --release `
            --manifest-path rust/Cargo.toml `
            -p hns-chromium-native-host `
            --target $env:RUST_TARGET

      - name: Self-sign and RFC 3161 timestamp the native host
        shell: pwsh
        env:
          WINDOWS_AUTHENTICODE_PUBLISHER: ${{ vars.WINDOWS_AUTHENTICODE_PUBLISHER }}
          WINDOWS_SELF_SIGNED_CERTIFICATE_SHA256: ${{ vars.WINDOWS_SELF_SIGNED_CERTIFICATE_SHA256 }}
          WINDOWS_SELF_SIGNED_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_BASE64 }}
          WINDOWS_SELF_SIGNED_PFX_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeHost = (
            Resolve-Path "rust/target/${{ matrix.rust-target }}/release/hns-chromium-native-host.exe"
          ).Path
          & ./scripts/sign-self-signed-windows.ps1 `
            -Path @($nativeHost) `
            -PinnedCertificate 'release/windows-self-signed-code-signing.cer'

      - name: Verify the signed host and build the embedded setup
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.WINDOWS_SELF_SIGNED_CERTIFICATE_SHA256 }}
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_AUTHENTICODE_PUBLISHER }}
          HNS_EXTENSION_IDS: ${{ needs.prepare.outputs.extension-ids }}
          HNS_HEADER_SNAPSHOT_PATH: ${{ github.workspace }}\release\hns_headers_300000.snapshot.gzip
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/import-msvc-environment.ps1 -Architecture $env:ARCHITECTURE
          $nativeHost = (
            Resolve-Path "rust/target/$env:RUST_TARGET/release/hns-chromium-native-host.exe"
          ).Path
          & ./scripts/verify-windows-binaries.ps1 `
            -Path @($nativeHost) `
            -RequireAuthenticode `
            -AllowSelfSigned `
            -ExpectedPublisher $env:EXPECTED_PUBLISHER `
            -ExpectedCertificateSha256 $env:EXPECTED_CERTIFICATE_SHA256 `
            -SelfSignedCertificate 'release/windows-self-signed-code-signing.cer'
          $env:RUSTFLAGS = (
            "$env:RUSTFLAGS -C target-feature=+crt-static"
          ).Trim()
          $env:HNS_NATIVE_HOST_PATH = $nativeHost
          cargo +1.92.0 build --locked --release `
            --manifest-path rust/Cargo.toml `
            -p hns-browser-setup `
            --bin hns-dane-browser-setup `
            --features embedded-host `
            --target $env:RUST_TARGET

      - name: Self-sign and RFC 3161 timestamp Setup
        shell: pwsh
        env:
          WINDOWS_AUTHENTICODE_PUBLISHER: ${{ vars.WINDOWS_AUTHENTICODE_PUBLISHER }}
          WINDOWS_SELF_SIGNED_CERTIFICATE_SHA256: ${{ vars.WINDOWS_SELF_SIGNED_CERTIFICATE_SHA256 }}
          WINDOWS_SELF_SIGNED_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_BASE64 }}
          WINDOWS_SELF_SIGNED_PFX_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (
            Resolve-Path "rust/target/${{ matrix.rust-target }}/release/hns-dane-browser-setup.exe"
          ).Path
          & ./scripts/sign-self-signed-windows.ps1 `
            -Path @($setup) `
            -PinnedCertificate 'release/windows-self-signed-code-signing.cer'

      - name: Verify, smoke test, and package finalized Windows assets
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.WINDOWS_SELF_SIGNED_CERTIFICATE_SHA256 }}
          EXPECTED_PUBLISHER: ${{ vars.WINDOWS_AUTHENTICODE_PUBLISHER }}
          EXTENSION_ID: ${{ needs.prepare.outputs.extension-id }}
          EXTENSION_IDS: ${{ needs.prepare.outputs.extension-ids }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUST_TARGET: ${{ matrix.rust-target }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source-date-epoch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeHost = (
            Resolve-Path "rust/target/$env:RUST_TARGET/release/hns-chromium-native-host.exe"
          ).Path
          $setup = (
            Resolve-Path "rust/target/$env:RUST_TARGET/release/hns-dane-browser-setup.exe"
          ).Path
          $output = "$env:GITHUB_WORKSPACE/dist/signed"
          [void](New-Item -ItemType Directory -Path $output -Force)
          $nativeEvidence = Join-Path `
            $output `
            "windows-native-host-signing-evidence-$env:ARCHITECTURE.json"
          $setupEvidence = Join-Path `
            $output `
            "windows-setup-signing-evidence-$env:ARCHITECTURE.json"
          & ./scripts/verify-windows-binaries.ps1 `
            -Path @($nativeHost) `
            -RequireAuthenticode `
            -AllowSelfSigned `
            -ExpectedPublisher $env:EXPECTED_PUBLISHER `
            -ExpectedCertificateSha256 $env:EXPECTED_CERTIFICATE_SHA256 `
            -SelfSignedCertificate 'release/windows-self-signed-code-signing.cer' `
            -EvidenceOutput $nativeEvidence
          & ./scripts/verify-windows-binaries.ps1 `
            -Path @($setup) `
            -RequireAuthenticode `
            -AllowSelfSigned `
            -ExpectedPublisher $env:EXPECTED_PUBLISHER `
            -ExpectedCertificateSha256 $env:EXPECTED_CERTIFICATE_SHA256 `
            -SelfSignedCertificate 'release/windows-self-signed-code-signing.cer' `
            -EvidenceOutput $setupEvidence
          if ($env:ARCHITECTURE -eq 'x64') {
            & $setup --status | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw 'The signed Windows setup status check failed.'
            }
            $process = Start-Process `
              -FilePath $setup `
              -ArgumentList '--gui-smoke-test' `
              -PassThru
            try {
              if (-not $process.WaitForExit(30000)) {
                throw 'The signed Windows setup GUI smoke check timed out.'
              }
              if ($process.ExitCode -ne 0) {
                throw "The signed Windows setup GUI smoke check failed: $($process.ExitCode)."
              }
            } finally {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
              }
            }
          }
          python scripts/package-release.py native `
            --output-dir $output `
            --source-date-epoch $env:SOURCE_DATE_EPOCH `
            --source-commit $env:SOURCE_COMMIT `
            --source-tag $env:RELEASE_TAG `
            --extension-id $env:EXTENSION_ID `
            --extension-ids $env:EXTENSION_IDS `
            --platform windows `
            --architecture $env:ARCHITECTURE `
            --rust-target $env:RUST_TARGET `
            --native-host $nativeHost `
            --windows-signing-evidence $nativeEvidence
          if ($LASTEXITCODE -ne 0) {
            throw 'Signed Windows native-host packaging failed.'
          }
          python scripts/package-release.py setup `
            --output-dir $output `
            --source-date-epoch $env:SOURCE_DATE_EPOCH `
            --source-commit $env:SOURCE_COMMIT `
            --source-tag $env:RELEASE_TAG `
            --extension-id $env:EXTENSION_ID `
            --extension-ids $env:EXTENSION_IDS `
            --platform windows `
            --architecture $env:ARCHITECTURE `
            --native-rust-target $env:RUST_TARGET `
            --setup-rust-target $env:RUST_TARGET `
            --setup-executable $setup `
            --embedded-native-host $nativeHost `
            --windows-signing-evidence $setupEvidence
          if ($LASTEXITCODE -ne 0) {
            throw 'Signed Windows setup packaging failed.'
          }

      - name: Retain finalized Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-windows-${{ matrix.architecture }}
          path: |
            dist/signed/*.zip
            dist/signed/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Verify assets and publish release
    needs: [prepare, quality, extension, native, signed_macos, signed_windows]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Verify every build before publication
        env:
          EXTENSION_RESULT: ${{ needs.extension.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SIGNED_MACOS_RESULT: ${{ needs.signed_macos.result }}
          SIGNED_WINDOWS_RESULT: ${{ needs.signed_windows.result }}
          RELEASE_STATE: ${{ needs.prepare.outputs.release-state }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_STATE" == published ]]; then
            exit 0
          fi
          if [[ "$QUALITY_RESULT" != success ||
                "$EXTENSION_RESULT" != success ||
                "$NATIVE_RESULT" != success ||
                "$SIGNED_MACOS_RESULT" != success ||
                "$SIGNED_WINDOWS_RESULT" != success ]]; then
            echo "::error::Release was not published because one or more packaging jobs did not succeed."
            exit 1
          fi

      - name: Check out the tagged signing disclosure
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Retrieve the read-only build artifacts
        if: ${{ needs.prepare.outputs.release-state != 'published' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Verify exact assets and publish
        env:
          CANONICAL_EXTENSION_ID: ${{ needs.prepare.outputs.canonical-extension-id }}
          EXTENSION_ID: ${{ needs.prepare.outputs.extension-id }}
          EXTENSION_IDS: ${{ needs.prepare.outputs.extension-ids }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE: ${{ needs.prepare.outputs.release-state }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          archives=(
            "hns-dane-browser-extension-v${VERSION}-mv3.zip"
            "hns-dane-browser-extension-v${VERSION}-mv3-store.zip"
            "hns-dane-browser-native-host-v${VERSION}-linux-x64.tar.gz"
            "hns-dane-browser-native-host-v${VERSION}-linux-arm64.tar.gz"
            "hns-dane-browser-native-host-v${VERSION}-windows-x64.zip"
            "hns-dane-browser-native-host-v${VERSION}-windows-arm64.zip"
            "hns-dane-browser-native-host-v${VERSION}-macos-x64.tar.gz"
            "hns-dane-browser-native-host-v${VERSION}-macos-arm64.tar.gz"
            "hns-dane-browser-setup-v${VERSION}-linux-x64.tar.gz"
            "hns-dane-browser-setup-v${VERSION}-linux-arm64.tar.gz"
            "hns-dane-browser-setup-v${VERSION}-windows-x64.zip"
            "hns-dane-browser-setup-v${VERSION}-windows-arm64.zip"
            "hns-dane-browser-setup-v${VERSION}-macos-x64.tar.gz"
            "hns-dane-browser-setup-v${VERSION}-macos-arm64.tar.gz"
          )
          build_assets=()
          for archive in "${archives[@]}"; do
            build_assets+=("$archive" "${archive}.sha256")
          done
          release_assets=("${build_assets[@]}" "SHA256SUMS")

          resolve_release_json() {
            local release_count
            local release_id
            local release_matches
            local release_pages
            release_pages="$(
              gh api --paginate \
                "repos/${GH_REPO}/releases?per_page=100"
            )"
            release_matches="$(
              jq -cs \
                --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)]' \
                <<<"$release_pages"
            )"
            release_count="$(jq -r 'length' <<<"$release_matches")"
            if [[ "$release_count" != 1 ]]; then
              echo "::error::Expected exactly one release for tag $RELEASE_TAG; found $release_count." >&2
              return 1
            fi
            release_id="$(jq -r '.[0].id // empty' <<<"$release_matches")"
            if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::GitHub returned an invalid release ID for tag $RELEASE_TAG." >&2
              return 1
            fi
            jq -c '.[0]' <<<"$release_matches"
          }

          verify_exact_remote_assets() {
            local asset_pages
            local assets_json
            local release_id
            local release_json
            local remote_names
            release_json="$(resolve_release_json)"
            release_id="$(jq -er '.id' <<<"$release_json")"
            asset_pages="$(
              gh api --paginate \
                "repos/${GH_REPO}/releases/${release_id}/assets?per_page=100"
            )"
            assets_json="$(jq -cs 'add' <<<"$asset_pages")"
            remote_names="$(jq -r '.[].name' <<<"$assets_json" | LC_ALL=C sort)"
            if ! diff -u \
              <(printf '%s\n' "${release_assets[@]}" | LC_ALL=C sort) \
              <(printf '%s\n' "$remote_names"); then
              echo "::error::Release assets do not exactly match the expected archive, sidecar, and aggregate-checksum set."
              return 1
            fi
            while IFS=$'\t' read -r name size digest; do
              if [[ ! "$size" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::Release asset is empty: $name"
                return 1
              fi
              local local_path="dist/release/$name"
              if [[ ! -f "$local_path" ]]; then
                echo "::error::Local release asset is missing: $name"
                return 1
              fi
              local local_size
              local_size="$(stat --format=%s "$local_path")"
              if [[ "$size" != "$local_size" ]]; then
                echo "::error::Remote release asset size differs from the verified local file: $name"
                return 1
              fi
              local local_digest
              local_digest="sha256:$(sha256sum "$local_path" | cut -d ' ' -f 1)"
              if [[ "$digest" != "$local_digest" ]]; then
                echo "::error::Remote release asset digest differs from the verified local file: $name"
                return 1
              fi
            done < <(
              jq -r '.[] | [.name, .size, (.digest // "")] | @tsv' \
                <<<"$assets_json"
            )
          }

          if [[ "$RELEASE_STATE" == published ]]; then
            mkdir -p dist/release
            gh release download "$RELEASE_TAG" --dir dist/release
            verify_exact_remote_assets
            (
              cd dist/release
              for archive in "${archives[@]}"; do
                sha256sum --check "${archive}.sha256"
              done
              sha256sum --check SHA256SUMS
            )
            exit 0
          fi

          if find dist/release -mindepth 1 -maxdepth 1 ! -type f | grep -q .; then
            echo "::error::Downloaded release artifact contains an unexpected non-file entry."
            exit 1
          fi
          local_names="$(
            find dist/release -mindepth 1 -maxdepth 1 -type f \
              -printf '%f\n' |
              LC_ALL=C sort
          )"
          if ! diff -u \
            <(printf '%s\n' "${build_assets[@]}" | LC_ALL=C sort) \
            <(printf '%s\n' "$local_names"); then
            echo "::error::Downloaded build artifacts are missing files or contain stale unexpected files."
            exit 1
          fi

          (
            cd dist/release
            for archive in "${archives[@]}"; do
              sha256sum --check "${archive}.sha256"
            done
            sha256sum "${archives[@]}" >SHA256SUMS
          )

          windows_certificate_fingerprint="$(
            jq -er '.certificateSha256' \
              release/windows-self-signed-code-signing.json
          )"
          if [[ ! "$windows_certificate_fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The committed Windows signing certificate fingerprint is invalid."
            exit 1
          fi

          notes_file="$(mktemp)"
          trap 'rm -f -- "$notes_file"' EXIT
          cat >"$notes_file" <<EOF
          Shakescape ${VERSION} provides a keyless first-submission store
          package, a canonical-ID Manifest V3 package for GitHub/unpacked use, and
          both native-host and graphical setup packages for Linux,
          Windows, and macOS on x64 and arm64.

          Canonical release/default extension ID: \`${CANONICAL_EXTENSION_ID}\`.
          Native registration ID selected for this release: \`${EXTENSION_ID}\`.
          Exact IDs compiled into Setup: `${EXTENSION_IDS}`.

          Source commit: https://github.com/${REPOSITORY}/commit/${SOURCE_COMMIT}
          License: https://github.com/${REPOSITORY}/blob/${RELEASE_TAG}/LICENSE
          Installation: each native-host archive contains platform-specific
          manual install/uninstall scripts. Each setup archive contains a graphical
          per-user setup application with the version-matched native host and
          validated mainnet headers through height 300,000 embedded. Both extension
          ZIPs embed all six finalized Setup archives and select locally by OS/CPU.
          Linux setup AppDirs bundle an isolated certutil and NSS/NSPR runtime with
          dependency licenses, so users do not need a system certutil package. The
          setup UI uses the host's coherent Wayland/X11/OpenGL stack. The
          v${VERSION} Linux Setup requires glibc 2.39 or newer and common desktop
          GUI libraries (Ubuntu 24.04 / Debian 13 generation).
          HNS donation: handshake:hs1q5997733eq7f4yyk2vq2z8gz3yqyvpz422ypggh?label=Denuo%20Web%20Handshake%20Browser&message=Handshake%20Browser%20donation
          GitHub Sponsors: https://github.com/sponsors/denuoweb

          Linux native hosts are statically linked with musl; Linux setup uses the
          native GNU target and host GUI libraries.
          Windows native hosts and Setup executables statically link the Microsoft
          CRT where supported and carry project self-signed Authenticode signatures
          with RFC 3161 SHA-256 timestamps. This project certificate is not publicly
          trusted, so SmartScreen and Unknown Publisher warnings may appear. Verify
          the archive SHA-256 against SHA256SUMS and the pinned certificate fingerprint
          `${windows_certificate_fingerprint}`. macOS binaries are Developer ID-signed
          and Apple-notarized; Setup tickets are stapled. Linux archives carry GitHub
          keyless build provenance attestations.

          Verify every downloaded artifact against SHA256SUMS before installing.
          EOF

          if [[ "$RELEASE_STATE" == absent ]]; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "Shakescape $VERSION" \
              --notes-file "$notes_file"
          elif [[ "$RELEASE_STATE" == draft ]]; then
            release_json="$(resolve_release_json)"
            release_id="$(jq -er '.id' <<<"$release_json")"
            gh api \
              --method PATCH \
              "repos/${GH_REPO}/releases/${release_id}" \
              -f name="Shakescape $VERSION" \
              -F "body=@$notes_file" >/dev/null
          else
            echo "::error::Unsupported release state: $RELEASE_STATE"
            exit 1
          fi

          upload_paths=()
          for asset in "${build_assets[@]}"; do
            upload_paths+=("dist/release/$asset")
          done
          upload_paths+=("dist/release/SHA256SUMS")
          gh release upload "$RELEASE_TAG" "${upload_paths[@]}" --clobber
          verify_exact_remote_assets
          release_json="$(resolve_release_json)"
          release_id="$(jq -er '.id' <<<"$release_json")"
          gh api \
            --method PATCH \
            "repos/${GH_REPO}/releases/${release_id}" \
            -F draft=false >/dev/null

          is_draft="$(
            resolve_release_json | jq -r '.draft'
          )"
          if [[ "$is_draft" != false ]]; then
            echo "::error::GitHub did not publish the fully verified release."
            exit 1
          fi
