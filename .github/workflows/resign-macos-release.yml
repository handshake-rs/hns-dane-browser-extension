name: Replace macOS release assets with signed builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to preserve
        required: true
        default: v0.5.9
        type: string
      confirm_replacement:
        description: Replace only that release's macOS assets and SHA256SUMS
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: signed-macos-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate the immutable source and published release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      extension-id: ${{ steps.validate.outputs.extension-id }}
      release-id: ${{ steps.validate.outputs.release-id }}
      source-commit: ${{ steps.validate.outputs.source-commit }}
      source-date-epoch: ${{ steps.validate.outputs.source-date-epoch }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Check out current release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: release-tools
          persist-credentials: false

      - name: Check out the existing release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: source
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Validate replacement scope and source identity
        id: validate
        env:
          CONFIRM_REPLACEMENT: ${{ inputs.confirm_replacement }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_REPLACEMENT" != true ]]; then
            echo "::error::Explicitly confirm replacement of the published macOS assets."
            exit 1
          fi
          if [[ "$GH_REPO" != handshake-rs/hns-dane-browser-extension ]]; then
            echo "::error::This credentialed workflow is restricted to the canonical repository."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow only from the current default branch."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::The requested release tag is malformed."
            exit 1
          fi

          bash source/scripts/check-version-consistency.sh
          source_commit="$(git -C source rev-parse HEAD)"
          tag_commit="$(git -C source rev-list -n 1 "$RELEASE_TAG")"
          version="$(jq -er '.version' source/extension/manifest.json)"
          tooling_version="$(jq -er '.version' release-tools/extension/manifest.json)"
          if [[ "$source_commit" != "$tag_commit" ||
                "$RELEASE_TAG" != "v$version" ||
                "$tooling_version" != "$version" ]]; then
            echo "::error::The tag, tagged source, and current release tooling version must remain identical."
            exit 1
          fi
          source_date_epoch="$(git -C source show -s --format=%ct "$source_commit")"

          release_json="$(
            gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}"
          )"
          if [[ "$(jq -er '.draft' <<<"$release_json")" != false ||
                "$(jq -er '.prerelease' <<<"$release_json")" != false ||
                "$(jq -r '.immutable // false' <<<"$release_json")" != false ]]; then
            echo "::error::The target must be a published, mutable, non-prerelease release."
            exit 1
          fi
          release_id="$(jq -er '.id' <<<"$release_json")"
          release_body="$(jq -r '.body // ""' <<<"$release_json")"
          if ! grep -Fq \
            "https://github.com/${GH_REPO}/commit/${source_commit}" \
            <<<"$release_body"; then
            echo "::error::The published release does not record the tagged source commit."
            exit 1
          fi

          inspection="$(mktemp -d)"
          trap 'find "$inspection" -mindepth 1 -delete; rmdir "$inspection"' EXIT
          archive="hns-dane-browser-native-host-v${version}-macos-arm64.tar.gz"
          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --pattern "$archive" \
            --dir "$inspection"
          stem="${archive%.tar.gz}"
          metadata="$(
            tar -xOf "$inspection/$archive" "$stem/RELEASE-METADATA.json"
          )"
          if [[ "$(jq -er '.source.commit' <<<"$metadata")" != "$source_commit" ||
                "$(jq -er '.source.tag' <<<"$metadata")" != "$RELEASE_TAG" ||
                "$(jq -er '.version' <<<"$metadata")" != "$version" ]]; then
            echo "::error::Existing macOS release metadata does not match its tag."
            exit 1
          fi
          extension_id="$(
            jq -er '.extension.nativeRegistrationIds[-1]' <<<"$metadata"
          )"
          if [[ ! "$extension_id" =~ ^[a-p]{32}$ ]]; then
            echo "::error::Existing macOS release metadata has an invalid extension ID."
            exit 1
          fi
          {
            echo "extension-id=$extension_id"
            echo "release-id=$release_id"
            echo "source-commit=$source_commit"
            echo "source-date-epoch=$source_date_epoch"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  quality:
    name: Validate replacement tooling
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out current release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Test packaging and credentialed workflow policy
        run: |
          set -euo pipefail
          bash scripts/verify-supply-chain.sh
          npm run lint:extension
          npm run build:extension
          python3 -m unittest -v \
            tests/test_release_packaging.py \
            tests/test_release_workflow.py \
            tests/test_resign_macos_workflow.py \
            tests/test_resign_windows_workflow.py

  signed_macos:
    name: Sign and notarize macOS ${{ matrix.architecture }}
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: macos-15-intel
            native-rust-target: x86_64-apple-darwin
            setup-rust-target: x86_64-apple-darwin
            macos-deployment-target: "11.0"
          - architecture: arm64
            runner: macos-15
            native-rust-target: aarch64-apple-darwin
            setup-rust-target: aarch64-apple-darwin
            macos-deployment-target: "11.0"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    environment: macos-signing
    permissions:
      contents: read
    steps:
      - name: Check out current release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: release-tools
          persist-credentials: false

      - name: Check out the existing release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: source
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Build, sign, notarize, staple, and verify
        shell: bash
        env:
          APPLE_CERTIFICATE_NAME: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_NAME }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_CERTIFICATE_SHA256: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_SHA256 }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ vars.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_NOTARY_API_KEY_ID: ${{ vars.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_PRIVATE_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ARCHITECTURE: ${{ matrix.architecture }}
          EXTENSION_ID: ${{ needs.prepare.outputs.extension-id }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}
          NATIVE_RUST_TARGET: ${{ matrix.native-rust-target }}
          OUTPUT_DIR: ${{ github.workspace }}/dist/signed
          RELEASE_TAG: ${{ inputs.release_tag }}
          SETUP_RUST_TARGET: ${{ matrix.setup-rust-target }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source-commit }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source-date-epoch }}
          SOURCE_ROOT: ${{ github.workspace }}/source
          TOOLS_ROOT: ${{ github.workspace }}/release-tools
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash release-tools/scripts/build-signed-macos-release.sh

      - name: Retain signed assets and Apple notarization evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-macos-${{ matrix.architecture }}
          path: |
            dist/signed/*.tar.gz
            dist/signed/*.tar.gz.sha256
            dist/signed/notary-reports/*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Retain Apple notarization evidence after a failed build
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-macos-notary-evidence-${{ matrix.architecture }}
          path: dist/signed/notary-reports/*.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  replace:
    name: Replace and verify published macOS assets
    needs: [prepare, quality, signed_macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out current release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Retrieve signed macOS builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signed-macos-*
          path: dist/signed
          merge-multiple: true

      - name: Back up, replace, and verify the exact release assets
        env:
          ASSET_DIR: ${{ github.workspace }}/dist/signed
          BACKUP_DIR: ${{ github.workspace }}/dist/release-backup
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/replace-macos-release-assets.sh

      - name: Retain the before-and-after release audit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-backup-${{ inputs.release_tag }}-${{ github.run_id }}
          path: dist/release-backup/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
