[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/hns-browser-setup",
    "crates/hns-chromium-native-host",
    "crates/hns-chromium-platform-runtime",
    "crates/hns-meshmine-pool-stats",
]

[workspace.package]
edition = "2024"
version = "0.5.6"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.92"
publish = false

[workspace.dependencies]
base64 = "0.22"
blake2 = "0.10"
bytes = "1"
clap = { version = "4.6.4", features = ["derive"] }
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
hex = "0.4"
getrandom = "0.3"
hns-cache = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-chromium-platform-runtime = { path = "crates/hns-chromium-platform-runtime" }
hns-chain = { package = "hns-browser-chain", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-core = { package = "hns-browser-primitives", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-dane = { package = "hns-browser-dane", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-dnssec = { package = "hns-browser-dnssec", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-gateway = { package = "hns-browser-gateway", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64", default-features = false, features = ["chromium"] }
hns-browser-observability = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-browser-runtime = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-icann-dane = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-namespace-resolution = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-resolution-policy = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-light-chain = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-service-authority = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "b24b66c382de53330ec21dd3137e056a2bea3e2d" }
hns-loopback-proxy = { package = "hns-browser-loopback-proxy", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64", default-features = false, features = ["chromium"] }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hns-p2p = { package = "hns-browser-p2p", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-resolver = { package = "hns-browser-resolver", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-sync = { package = "hns-browser-sync", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
hns-transport = { package = "hns-browser-transport", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64", default-features = false, features = ["chromium"] }
hns-urkel = { package = "hns-browser-urkel", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "65c397e8347f37085ea67d2c9c745ce896328e64" }
http = "1"
httparse = "1.10"
idna = "1.1"
libc = "0.2"
k256 = "0.13"
num-bigint = "0.4"
num-traits = "0.2"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "x509-parser"] }
ring = "0.17.14"
rusqlite = { version = "0.39", features = ["bundled"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.8"
winit = { version = "0.30.13", default-features = false }
zeroize = "1.8"

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "thin"
panic = "abort"
