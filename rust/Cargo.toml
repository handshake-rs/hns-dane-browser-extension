[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/hns-browser-setup",
    "crates/hns-chromium-native-host",
    "crates/hns-chromium-platform-runtime",
    "crates/hns-cache",
    "crates/hns-chain",
    "crates/hns-core",
    "crates/hns-dane",
    "crates/hns-dnssec",
    "crates/hns-gateway",
    "crates/hns-loopback-proxy",
    "crates/hns-p2p",
    "crates/hns-resolver",
    "crates/hns-sync",
    "crates/hns-transport",
    "crates/hns-urkel",
]

[workspace.package]
edition = "2024"
version = "0.5.3"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.92"

[workspace.dependencies]
base64 = "0.22"
blake2 = "0.10"
bytes = "1"
clap = { version = "4.6.4", features = ["derive"] }
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
hex = "0.4"
getrandom = "0.3"
hns-cache = { path = "crates/hns-cache" }
hns-chromium-platform-runtime = { path = "crates/hns-chromium-platform-runtime" }
hns-chain = { path = "crates/hns-chain" }
hns-core = { path = "crates/hns-core" }
hns-dane = { path = "crates/hns-dane" }
hns-dnssec = { path = "crates/hns-dnssec" }
hns-gateway = { path = "crates/hns-gateway" }
hns-browser-observability = { git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "7f7bb8fa100c2393f2cd5a64c64bf5e20a0f3ab5" }
hns-browser-runtime = { git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "7f7bb8fa100c2393f2cd5a64c64bf5e20a0f3ab5" }
hns-icann-dane = { git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "7f7bb8fa100c2393f2cd5a64c64bf5e20a0f3ab5" }
hns-namespace-resolution = { git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "7f7bb8fa100c2393f2cd5a64c64bf5e20a0f3ab5" }
hns-resolution-policy = { git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "7f7bb8fa100c2393f2cd5a64c64bf5e20a0f3ab5" }
hns-loopback-proxy = { path = "crates/hns-loopback-proxy" }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hns-p2p = { path = "crates/hns-p2p" }
hns-resolver = { path = "crates/hns-resolver" }
hns-sync = { path = "crates/hns-sync" }
hns-transport = { path = "crates/hns-transport" }
hns-urkel = { path = "crates/hns-urkel" }
http = "1"
httparse = "1.10"
idna = "1.1"
num-bigint = "0.4"
num-traits = "0.2"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "x509-parser"] }
ring = "0.17.14"
rusqlite = { version = "0.39", features = ["bundled"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.8"
zeroize = "1.8"

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "thin"
panic = "abort"
