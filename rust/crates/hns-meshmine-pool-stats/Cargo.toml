[package]
name = "hns-meshmine-pool-stats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blake2.workspace = true
hex.workspace = true
hns-dane-engine.workspace = true
k256.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
thiserror.workspace = true

# The native host release must not depend on a runner's OpenSSL installation.
# hns-dane-engine uses OpenSSL transitively; vendor it for musl, Windows, and
# macOS so the packaged host is self-contained on every shipping platform.
[target.'cfg(any(target_env = "musl", target_os = "windows", target_os = "macos"))'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }

[dev-dependencies]
hns-hrm = "=0.5.1"
hns-service-authority = "=0.5.1"
